---
services:
  omo:
    build:
      context: .
      dockerfile: Dockerfile
      # Build omo with the host user's uid/gid so the bind-mounted tree
      # (which keeps host ownership on Linux/WSL2) is writable inside
      # the container.
      args:
        HOST_UID: ${HOST_UID:?HOST_UID is required — run up.sh}
        HOST_GID: ${HOST_GID:?HOST_GID is required — run up.sh}
    image: omo:latest
    container_name: omo
    hostname: omo
    volumes:
      # The directory you run compose from becomes the project directory,
      # always mounted at /home/omo/project inside the container. cd into
      # the project you want to work on before running compose.
      - ${PWD}:/home/omo/project
      - ${HOME}/.omo-agentmemory/data:/data
    ports:
      # Only the agentmemory viewer is published, on the host loopback. It is
      # a bearer-authorized proxy for the full REST API (host tools use
      # http://127.0.0.1:3113 with AGENTMEMORY_SECRET); the REST worker
      # itself stays bound to the container's loopback (agentmemory default).
      - "127.0.0.1:3113:3113"
    working_dir: /home/omo/project
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - ".env.agentmemory"
      - ".env.secrets"
