---
services:
  omo:
    build:
      context: .
      dockerfile: Dockerfile
    image: omo:latest
    container_name: omo
    hostname: omo
    volumes:
      # The directory you run `docker compose` from becomes the project
      # directory inside the container. cd into the project you want to work
      # on before running this compose file.
      - ${PWD}:/home/omo/project
      - ${HOME}/.omo-agentmemory/data:/data
    ports:
      # Only the agentmemory viewer is published, on the host loopback. It is
      # a bearer-authorized proxy for the full REST API (host tools use
      # http://127.0.0.1:3113 with AGENTMEMORY_SECRET); the REST worker
      # itself stays bound to the container's loopback (agentmemory default).
      - "127.0.0.1:3113:3113"
    working_dir: /home/omo/project
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - ".env.agentmemory"
      - ".env.secrets"
